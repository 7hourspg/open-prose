<svg width="100%" viewBox="0 0 900 640" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Open Prose architecture — layered view</title>
  <desc>A layered view of the Open Prose desktop app. A React frontend (TanStack Router + Query, Plate.js editor) talks to a thin Wails-bound Go facade. The facade delegates to ProjectService and ExportService, which in turn use a SQLite repository and an embedded template export engine. Media files live under a per-project directory on disk and are served back through the Wails AssetServer.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t   { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .h   { font-weight: 600; font-size: 13px; }
      .s   { font-size: 11px; }
      .lbl { font-size: 11px; fill: rgb(100,90,75); }
      .layer { font-family: 'Source Serif 4','New York',Georgia,serif; font-size: 12px; font-style: italic; fill: rgb(120,110,95); }
    </style>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="rgb(120,110,95)">Open Prose — Architecture</text>
  <text x="450" y="50" text-anchor="middle" class="layer">React + Wails v2 + Go + SQLite · all on your machine</text>

  <!-- ============================================================ -->
  <!-- LAYER 1: Frontend                                              -->
  <!-- ============================================================ -->
  <text x="40" y="92" class="layer">Frontend · React 19</text>
  <rect x="40" y="100" width="820" height="80" rx="10" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>

  <g>
    <rect x="60" y="118" width="180" height="46" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgb(93,202,165)" stroke-width="0.6"/>
    <text x="150" y="138" text-anchor="middle" class="t h" fill="rgb(159,225,203)">routes/</text>
    <text x="150" y="154" text-anchor="middle" class="t s" fill="rgb(93,202,165)">TanStack Router file routes</text>
  </g>
  <g>
    <rect x="260" y="118" width="180" height="46" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgb(93,202,165)" stroke-width="0.6"/>
    <text x="350" y="138" text-anchor="middle" class="t h" fill="rgb(159,225,203)">features/editor</text>
    <text x="350" y="154" text-anchor="middle" class="t s" fill="rgb(93,202,165)">Plate.js · FormatBar · ExportSheet</text>
  </g>
  <g>
    <rect x="460" y="118" width="180" height="46" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgb(93,202,165)" stroke-width="0.6"/>
    <text x="550" y="138" text-anchor="middle" class="t h" fill="rgb(159,225,203)">features/projects</text>
    <text x="550" y="154" text-anchor="middle" class="t s" fill="rgb(93,202,165)">ProjectsList · NewProjectDialog</text>
  </g>
  <g>
    <rect x="660" y="118" width="180" height="46" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgb(93,202,165)" stroke-width="0.6"/>
    <text x="750" y="138" text-anchor="middle" class="t h" fill="rgb(159,225,203)">features/onboarding</text>
    <text x="750" y="154" text-anchor="middle" class="t s" fill="rgb(93,202,165)">Welcome · Basics · Template</text>
  </g>

  <!-- Arrow to bridge -->
  <line x1="450" y1="180" x2="450" y2="208" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="468" y="198" class="t lbl">TanStack Query hooks · features/*/api.ts</text>

  <!-- ============================================================ -->
  <!-- BRIDGE                                                         -->
  <!-- ============================================================ -->
  <text x="40" y="224" class="layer">Bridge · auto-generated TypeScript</text>
  <rect x="40" y="232" width="820" height="44" rx="10" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
  <text x="450" y="252" text-anchor="middle" class="t h" fill="rgb(250,199,117)">frontend/wailsjs/go/api/App.{js,d.ts}</text>
  <text x="450" y="268" text-anchor="middle" class="t s" fill="rgb(239,159,39)">Generated by Wails · one TS function per Go method · runtime EventsOn for deploy:log / preview:log</text>

  <line x1="450" y1="276" x2="450" y2="304" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: Go facade                                             -->
  <!-- ============================================================ -->
  <text x="40" y="320" class="layer">Go · api/</text>
  <rect x="40" y="328" width="820" height="56" rx="10" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
  <text x="450" y="349" text-anchor="middle" class="t h" fill="rgb(206,203,246)">App — Wails-bound facade</text>
  <text x="450" y="367" text-anchor="middle" class="t s" fill="rgb(175,169,236)">Project / Post CRUD · UploadImage · ExportProjectByID · DeployVercel · StartPreview · OpenURL</text>

  <line x1="450" y1="384" x2="450" y2="412" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- LAYER 3: Services                                              -->
  <!-- ============================================================ -->
  <text x="40" y="428" class="layer">Go · service/</text>
  <g>
    <rect x="40" y="436" width="400" height="60" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text x="240" y="458" text-anchor="middle" class="t h" fill="rgb(245,196,179)">ProjectService</text>
    <text x="240" y="478" text-anchor="middle" class="t s" fill="rgb(240,153,123)">CRUD · slug rules · reorder · auto-suffix · about reserved</text>
  </g>
  <g>
    <rect x="460" y="436" width="400" height="60" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
    <text x="660" y="458" text-anchor="middle" class="t h" fill="rgb(245,196,179)">ExportService</text>
    <text x="660" y="478" text-anchor="middle" class="t s" fill="rgb(240,153,123)">Full export or posts-only · remembers last output dir</text>
  </g>

  <!-- Arrows to bottom row -->
  <line x1="160" y1="496" x2="160" y2="528" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="496" x2="450" y2="528" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="496" x2="740" y2="528" stroke="rgb(120,110,95)" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- LAYER 4: Persistence + Export                                  -->
  <!-- ============================================================ -->
  <text x="40" y="544" class="layer">Storage &amp; output</text>
  <g>
    <rect x="40" y="552" width="240" height="60" rx="10" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
    <text x="160" y="574" text-anchor="middle" class="t h" fill="rgb(192,221,151)">repository/sqlite</text>
    <text x="160" y="594" text-anchor="middle" class="t s" fill="rgb(151,196,89)">modernc.org/sqlite · pure Go</text>
  </g>
  <g>
    <rect x="300" y="552" width="300" height="60" rx="10" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
    <text x="450" y="574" text-anchor="middle" class="t h" fill="rgb(192,221,151)">media/ · per-project images</text>
    <text x="450" y="594" text-anchor="middle" class="t s" fill="rgb(151,196,89)">~/OpenProse/projects/&lt;id&gt;/media · served at /media/&lt;file&gt;</text>
  </g>
  <g>
    <rect x="620" y="552" width="240" height="60" rx="10" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
    <text x="740" y="574" text-anchor="middle" class="t h" fill="rgb(192,221,151)">export/ engine</text>
    <text x="740" y="594" text-anchor="middle" class="t s" fill="rgb(151,196,89)">embedded base/ + theme/ · writes Next.js folder</text>
  </g>

  <!-- Footer -->
  <text x="450" y="630" text-anchor="middle" class="t lbl" font-style="italic">SQLite file: ~/Library/Application Support/OpenProse/blog-editor.db  (XDG/AppData on Linux/Windows)</text>
</svg>
